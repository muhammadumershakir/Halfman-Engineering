<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <!-- Dawood Corporate Blue: #0B2B6E -->
  <!-- Stylized DE Monogram -->
  <g transform="translate(10, 8)" fill="none" stroke="#0B2B6E" stroke-width="12" stroke-linejoin="round" stroke-linecap="square">
    <!-- Outer Arc / D Back -->
    <line x1="8" y1="4" x2="8" y2="80"/>
    <path d="M 8 4 C 44 4, 76 20, 76 42 C 76 64, 44 80, 8 80"/>
    <!-- Intersecting E Wing -->
    <path d="M 44 14 C 68 26, 76 42, 44 42 L 8 42"/>
    <path d="M 44 70 C 68 58, 76 42, 44 42"/>
  </g>

  <!-- Typography: DAWOOD ENGINEERING -->
  <g fill="#0B2B6E">
    <text x="110" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" letter-spacing="1">DAWOOD</text>
    <text x="110" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="30" letter-spacing="0.5">ENGINEERING</text>
  </g>
</svg>
