<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <!-- Procon Blue 'P' -->
  <g transform="translate(45, 10)">
    <path d="M 0 0 L 90 0 C 125 0, 150 25, 150 60 C 150 95, 125 120, 90 120 L 56 120 L 56 120 L 56 120 L 56 120 L 56 0 Z" fill="#005B9C"/>
    <!-- Leg of P -->
    <rect x="0" y="0" width="56" height="120" fill="#005B9C"/>

    <!-- Lime Green Hexagon Nut in P Loop -->
    <polygon points="102,32 126,46 126,74 102,88 78,74 78,46" fill="#8DC63F"/>
    <!-- Black Circular Bore in Center of Nut -->
    <circle cx="102" cy="60" r="16" fill="#1A1A1A"/>
  </g>

  <!-- Typography: PROCON -->
  <text x="120" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" letter-spacing="4" fill="#181818" text-anchor="middle">PROCON</text>
  <!-- Typography: Procon Engineering -->
  <text x="120" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial', sans-serif" font-weight="700" font-size="16" letter-spacing="0.5" fill="#2E2E2E" text-anchor="middle">Procon Engineering</text>
</svg>
